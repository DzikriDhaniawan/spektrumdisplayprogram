<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Digital Signage Media Display</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Signage App Container -->
  <div class="signage-app">

    <!-- Top Header Bar -->
    <header class="signage-header">
      <div class="brand-section">
        <div class="brand-info">
          <h1>DIGITAL DISPLAY</h1>
          <p>Materi Video</p>
        </div>
      </div>

      <!-- Right Header: Live Clock & Action Buttons -->
      <div class="header-right">
        <div class="clock-widget">
          <div class="clock-time" id="clock-time">00:00:00</div>
          <div class="clock-date" id="clock-date">Memuat tanggal...</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="refresh-btn" title="Segarkan Halaman (F5)" aria-label="Segarkan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </button>
          <button class="icon-btn" id="fullscreen-btn" title="Layar Penuh (F11 / Kiosk)" aria-label="Layar Penuh">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="filter-bar">
      <!-- Category Chips -->
      <div class="category-chips" id="category-chips" role="tablist">
        <!-- Generated dynamically via JS -->
      </div>

      <!-- Search Box -->
      <div class="search-box-wrapper">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Cari materi video..." 
          autocomplete="off"
        >
      </div>
    </div>

    <!-- Main Content Area: Video Grid -->
    <main class="main-content">
      <div class="section-title-wrap">
        <div class="section-title-left">
          <h2 class="section-title">
            <span>Koleksi Video</span>
          </h2>
          <span class="video-counter-badge" id="video-count-badge">Memuat daftar...</span>
        </div>

        <!-- Tombol Loop Khusus Folder (Hanya aktif saat memilih folder tertentu, bukan 'Semua') -->
        <button class="loop-folder-action-btn" id="loop-folder-action-btn" style="display: none;" title="Putar Berurutan Semua Video di Folder Ini">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <span id="loop-folder-btn-text">Putar Berurutan (Loop Folder Ini)</span>
        </button>
      </div>

      <div class="video-grid" id="video-grid">
        <!-- Video Cards generated dynamically via JS -->
      </div>
    </main>

  </div>

  <!-- Remote TV Navigation Helper Toast -->
  <div class="remote-helper">
    <span>Navigasi Remote:</span>
    <span class="kbd-badge">Panah</span>
    <span>Pilih</span>
    <span class="kbd-badge">OK</span>
    <span>Putar</span>
    <span class="kbd-badge">L</span>
    <span>Mode Loop</span>
    <span class="kbd-badge">Back / Esc</span>
    <span>Keluar</span>
  </div>

  <!-- Fullscreen Video Player Modal -->
  <div class="player-modal" id="player-modal" role="dialog" aria-modal="true">
    
    <!-- Player Top Bar Overlay -->
    <div class="player-header">
      <button class="back-btn" id="player-back-btn" aria-label="Kembali ke Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <!-- Loop & Playback Controls Group -->
      <div class="player-controls-group">
        <button class="player-tool-btn" id="player-prev-btn" title="Video Sebelumnya di Folder Ini" aria-label="Sebelumnya">
          ⏮
        </button>

        <!-- Tombol Pengatur Loop (1 Video / Folder Ini / Tanpa Loop) -->
        <button class="player-loop-toggle-btn active-single" id="player-loop-btn" title="Klik untuk Mengganti Mode Loop" aria-label="Ganti Mode Loop">
          <span id="player-loop-icon">🔂</span>
          <span id="player-loop-label">Loop: 1 Video</span>
        </button>

        <button class="player-tool-btn" id="player-next-btn" title="Video Berikutnya di Folder Ini" aria-label="Berikutnya">
          ⏭
        </button>
      </div>

      <!-- Kotak Judul / Nama File -->
      <div class="player-title-info">
        <h2 id="player-title">nama_file.mp4</h2>
        <p id="player-category" style="display: none;"></p>
      </div>
    </div>

    <!-- Video Element Container (Mendukung Video Lokal & Google Drive Embed) -->
    <div class="video-container">
      <video id="main-video" class="main-video" playsinline preload="auto" referrerpolicy="no-referrer">
        Browser Anda tidak mendukung pemutaran video HTML5.
      </video>
      <iframe id="main-iframe" class="main-iframe" allow="autoplay; fullscreen" style="display: none;" referrerpolicy="no-referrer"></iframe>

      <!-- Tombol Putar Tengah Besar (Muncul saat video pause / butuh interaksi) -->
      <button class="player-center-play-btn" id="player-center-play-btn" aria-label="Putar Video">
        <svg viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
      </button>
    </div>

    <!-- Minimalist Bottom Progress Bar (auto-hides dengan header) -->
    <div class="player-progress-container" id="player-progress-container">
      <div class="player-progress-bar" id="player-progress-bar"></div>
    </div>

    <!-- Bottom Hint -->
    <div class="player-bottom-hint">
      Tekan tombol <b>Back / Esc</b> untuk menu • Tekan <b>L</b> pada remote untuk ganti mode Loop
    </div>
  </div>

  <!-- Load Videos Data & Core Script -->
  <script src="videos-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
